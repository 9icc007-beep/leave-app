<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#255c4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="休假小账"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>休假小账</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#243d34;background:#f5f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:28px 20px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}h1{font-size:23px;margin:0;letter-spacing:1px}header small{display:block;color:#78847b;margin-top:6px;font-size:12px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#e9ede5;color:#255c4b}button:focus-visible,a:focus-visible{outline:3px solid #dba14a;outline-offset:3px}.summary{background:#255c4b;color:#fff;padding:26px;border-radius:24px;box-shadow:0 12px 28px #255c4b15}.eyebrow{font-size:13px;opacity:.8}.balance{font-size:64px;font-weight:650;line-height:1.3;margin:8px 0}.balance small{font-size:16px;font-weight:400;margin-left:8px}.stats{display:flex;gap:32px;border-top:1px solid #ffffff28;padding-top:17px}.stats span{display:block;font-size:12px;color:#c3d4ca}.stats strong{display:block;font-size:19px;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 28px}.actions button{padding:18px 6px;font-weight:600;background:#e1eade}.actions button:last-child{background:#f0e7d8;color:#805f30}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}h2{font-size:17px;margin:0}select{border:1px solid #dce1d7;background:transparent;padding:7px;border-radius:9px;color:#526559;max-width:145px}.record{display:flex;gap:13px;align-items:center;background:white;border:1px solid #e7eadf;padding:16px;border-radius:17px;margin-bottom:10px}.badge{width:40px;height:40px;border-radius:13px;background:#eaf0e5;display:grid;place-items:center;font-size:23px;flex-shrink:0}.record.used .badge{background:#f7eee0;color:#9a7141}.record .info{flex:1;min-width:0}.record b{font-size:14px;display:block;word-break:break-word;white-space:pre-wrap}.record small{display:block;color:#8a938b;font-size:12px;margin-top:5px}.amount{font-weight:650;font-size:19px;white-space:nowrap}.record.used .amount{color:#9a7141}.edit{padding:7px 5px;background:transparent;font-size:12px;color:#738375}.empty{text-align:center;padding:40px 15px;color:#879185;line-height:1.9;border:1px dashed #d8dfd1;border-radius:18px}.foot{margin-top:28px;color:#8a9387;font-size:12px;line-height:1.8}.foot nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.foot button{font-size:12px;padding:9px 12px}dialog{width:calc(100% - 32px);max-width:440px;border:0;border-radius:23px;padding:25px;color:#243d34;max-height:90dvh;overflow:auto}dialog::backdrop{background:#152c2580}label{display:block;font-size:13px;margin-top:18px}input{width:100%;padding:13px;margin-top:8px;border:1px solid #d6ded2;border-radius:10px;min-width:0;background:white;color:#243d34}input:focus{outline:2px solid #769c7d}.quick{display:flex;gap:8px;margin-top:9px}.quick button{flex:1;padding:9px;font-size:13px}.modal-actions{display:flex;gap:10px;margin-top:24px}.modal-actions button{flex:1}.primary{background:#255c4b;color:white}.delete{color:#a75040;background:transparent;display:block;margin:14px auto 0;font-size:13px}.hint{font-size:12px;line-height:1.7;color:#7a877b}#status{padding:12px;background:#fff3d8;border-radius:12px;font-size:13px;margin:12px 0}#status:empty{display:none}.toolbar{display:flex;align-items:center;gap:6px}.pill{font-size:11px;color:#6f806f;background:#e9ede3;padding:6px 9px;border-radius:20px}
.accounts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.account{background:#fff;border:2px solid #e1e6dc;text-align:left;padding:16px}.account[aria-pressed="true"]{border-color:#255c4b;background:#e7eee2}.account span{display:block;font-size:13px}.account strong{display:block;font-size:27px;margin-top:8px}.account small{font-size:12px;font-weight:400}#category{display:block;width:100%;max-width:none;margin-top:8px;padding:12px;background:white}</style></head><body><main>
<header><div><h1>休假小账 <span style="color:#92a387">↗</span></h1><small>把努力攒成，好好休息的时间。</small></div><span class="pill">按天记录</span></header>
<div id="status" role="status"></div>
<div class="accounts" aria-label="选择假期类型"><button class="account" id="comp-tab" aria-pressed="true"><span>调休余额</span><strong><span id="comp-balance" style="display:inline;font-size:inherit">0</span> <small>天</small></strong></button><button class="account" id="annual-tab" aria-pressed="false"><span>年假余额</span><strong><span id="annual-balance" style="display:inline;font-size:inherit">0</span> <small>天</small></strong></button></div><section class="summary" aria-label="当前假期统计"><div class="eyebrow" id="balance-label">当前可用调休</div><div class="balance"><span id="balance">0</span><small>天</small></div><div class="stats"><div><span>累计获得</span><strong id="earned">0 天</strong></div><div><span>累计已用</span><strong id="used">0 天</strong></div></div></section>
<div class="actions"><button id="add">＋ 记一笔获得</button><button id="use">− 记一笔使用</button></div>
<section><div class="section-head"><h2 id="records-title">调休明细</h2><select id="filter" aria-label="筛选记录"><option value="all">全部记录</option><option value="earn">只看获得</option><option value="use">只看使用</option></select></div><div id="records"></div></section>
<footer class="foot">数据保存在当前手机、当前浏览器中。更换设备或清除浏览器数据前，请先导出备份。<nav><button id="export">导出备份</button><button id="import">恢复备份</button><button id="install">添加到手机桌面</button></nav><span>支持 0.5 天等小数 · 不自动计算过期 · 年假和调休分别计算</span></footer>
<input id="file" type="file" accept="application/json,.json" hidden>
</main><dialog id="editor"><form id="form"><h2 id="form-title">记一笔获得</h2><label for="category">假期类型</label><select id="category"><option value="comp">调休</option><option value="annual">年假</option></select><label for="days">天数</label><input id="days" type="number" min="0.01" max="100000" step="0.01" inputmode="decimal" placeholder="例如 0.5" required><div class="quick"><button type="button" data-days="0.5">半天</button><button type="button" data-days="1">1 天</button><button type="button" data-days="2">2 天</button></div><label for="date">日期</label><input id="date" type="date" required><label for="note">备注（选填）</label><input id="note" maxlength="100" placeholder="例如：周末加班 / 周五休息"><p id="form-hint" class="hint"></p><div class="modal-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存记录</button></div><button type="button" class="delete" id="delete" hidden>删除这条记录</button></form></dialog>
<dialog id="help"><h2>把小账放到手机桌面</h2><p class="hint">iPhone：用 Safari 打开网址，点击分享按钮，选择「添加到主屏幕」。</p><p class="hint">安卓：用 Chrome 等浏览器打开网址，在菜单中选择「添加到主屏幕」或「安装应用」。</p><p class="hint">请一直使用同一网址和浏览器，以便读取原有记录。首次联网打开后，可离线使用。</p><button id="close-help" class="primary" style="width:100%">知道了</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='leave-ledger-v1';let selected='comp';const categoryName=c=>c==='annual'?'年假':'调休';const normalize=r=>({...r,category:r.category===undefined?'comp':r.category});let records=[],mode='earn',editing=null,storageOk=true;
function status(s){$('status').textContent=s}function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function fmt(n){return String(Number(n.toFixed(2)))}
function valid(r){if(!r||(r.category!==undefined&&!['comp','annual'].includes(r.category))||typeof r.id!=='string'||!r.id||!['earn','use'].includes(r.type)||!Number.isFinite(r.days)||r.days<=0||r.days>100000||Math.abs(r.days*100-Math.round(r.days*100))>0.00001||typeof r.note!=='string'||r.note.length>100||typeof r.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return false;const d=new Date(r.date+'T12:00:00Z');return !isNaN(d)&&d.toISOString().slice(0,10)===r.date}
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(!Array.isArray(data)||!data.every(valid)||new Set(data.map(x=>x.id)).size!==data.length)throw Error();records=data.map(normalize)}}catch(e){storageOk=false;status('无法读取本机数据，已暂停保存，避免覆盖原记录。请检查浏览器存储设置。')}
function save(next){if(!storageOk){status('存储不可用，记录未保存。请检查浏览器设置后重新打开。');return false}try{localStorage.setItem(KEY,JSON.stringify(next));records=next.map(normalize);render();return true}catch(e){status('保存失败，记录未更改。请检查浏览器可用空间。');return false}}
function totals(category){let earned=0,used=0;records.filter(r=>r.category===category).forEach(r=>r.type==='earn'?earned+=Math.round(r.days*100):used+=Math.round(r.days*100));return {earned:earned/100,used:used/100,balance:(earned-used)/100}}
function render(){const name=categoryName(selected),t=totals(selected);$('balance').textContent=fmt(t.balance);$('earned').textContent=fmt(t.earned)+' 天';$('used').textContent=fmt(t.used)+' 天';$('comp-balance').textContent=fmt(totals('comp').balance);$('annual-balance').textContent=fmt(totals('annual').balance);$('comp-tab').setAttribute('aria-pressed',String(selected==='comp'));$('annual-tab').setAttribute('aria-pressed',String(selected==='annual'));$('balance-label').textContent='当前可用'+name;$('records-title').textContent=name+'明细';$('add').textContent='＋ 获得'+name;$('use').textContent='− 使用'+name;const list=records.filter(r=>r.category===selected&&($('filter').value==='all'||r.type===$('filter').value)).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));$('records').replaceChildren();if(!list.length){const el=document.createElement('div');el.className='empty';el.textContent=records.length?'暂无此类记录':'还没有记录，先记一笔吧。';$('records').append(el)}list.forEach(r=>{const row=document.createElement('article');row.className='record'+(r.type==='use'?' used':'');const badge=document.createElement('div');badge.className='badge';badge.textContent=r.type==='earn'?'＋':'−';const info=document.createElement('div');info.className='info';const title=document.createElement('b');title.textContent=r.note||(r.type==='earn'?'获得'+categoryName(r.category):'使用'+categoryName(r.category));const date=document.createElement('small');date.textContent=r.date;info.append(title,date);const amount=document.createElement('div');amount.className='amount';amount.textContent=(r.type==='earn'?'+':'−')+fmt(r.days)+' 天';const edit=document.createElement('button');edit.className='edit';edit.textContent='编辑';edit.setAttribute('aria-label','编辑 '+r.date+' '+title.textContent);edit.onclick=()=>open(r.type,r);row.append(badge,info,amount,edit);$('records').append(row)})}
function open(type,r){mode=type;$('category').value=r?.category||selected;editing=r?.id||null;$('form-title').textContent=(r?'编辑':'记一笔')+(type==='earn'?'获得':'使用')+categoryName($('category').value);$('days').value=r?.days||'';$('date').value=r?.date||today();$('note').value=r?.note||'';$('delete').hidden=!r;$('form-hint').textContent=type==='earn'?'首次使用时，可把已有余额记为一笔获得，备注「初始余额」。':'余额不足时也可记录，负数余额表示已提前使用该类假期。';$('editor').showModal()}
$('comp-tab').onclick=()=>{selected='comp';render()};$('annual-tab').onclick=()=>{selected='annual';render()};$('category').onchange=()=>{$('form-title').textContent=(editing?'编辑':'记一笔')+(mode==='earn'?'获得':'使用')+categoryName($('category').value)};$('add').onclick=()=>open('earn');$('use').onclick=()=>open('use');$('cancel').onclick=()=>$('editor').close();$('filter').onchange=render;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{$('days').value=b.dataset.days});
$('form').onsubmit=e=>{e.preventDefault();const r={id:editing||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),type:mode,category:$('category').value,days:Number($('days').value),date:$('date').value,note:$('note').value.trim()};if(!valid(r)){alert('请填写有效日期和天数，天数最多支持两位小数。');return}const next=editing?records.map(x=>x.id===editing?r:x):[...records,r];if(save(next)){selected=r.category;render();$('editor').close()}};$('delete').onclick=()=>{if(confirm('确定删除这条记录？删除后余额将重新计算。')&&save(records.filter(x=>x.id!==editing)))$('editor').close()};
$('export').onclick=()=>{if(!storageOk){alert('当前存储读取失败，无法导出完整备份。');return}const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='休假小账备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error();const data=JSON.parse(await f.text());if(![1,2].includes(data.version)||!Array.isArray(data.records)||!data.records.every(valid)||new Set(data.records.map(r=>r.id)).size!==data.records.length)throw Error();if(confirm('备份包含 '+data.records.length+' 条记录。恢复将替换当前全部记录，建议先导出当前备份。确定恢复？')){if(save(data.records.map(normalize)))status('已恢复 '+data.records.length+' 条记录。')}}catch(e){alert('无法恢复：请选择本工具导出的有效 JSON 备份。')}finally{$('file').value=''}};
$('install').onclick=()=>$('help').showModal();$('close-help').onclick=()=>$('help').close();render();window.addEventListener('storage',e=>{if(e.key===KEY)location.reload()});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
